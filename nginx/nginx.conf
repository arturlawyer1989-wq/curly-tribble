# Главный конфиг nginx. Настройки сайта лежат в templates/default.conf.template,
# при старте контейнера в них подставляются адреса сервисов.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    log_format  main  '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" $request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Ограничение частоты запросов с одного адреса: отдельно для API и для страниц.
    # Превышение отдаётся как 429 с понятным сообщением (см. шаблон сайта).
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;
    limit_req_status 429;
    # Срабатывание лимита это штатная ситуация, а не ошибка сервера
    limit_req_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
