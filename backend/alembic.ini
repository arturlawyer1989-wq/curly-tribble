# Настройки Alembic (миграции базы данных).
# Адрес базы подставляется из переменных окружения в alembic/env.py.
[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Разделитель путей в prepend_sys_path (устраняет предупреждение Alembic)
path_separator = os
