# Интернет-магазин «ДЕТАЛЬ 24». Запуск: docker compose up -d --build
# Все настройки берутся из файла .env (образец в .env.example).
name: detal24

x-backend-common: &backend-common
  build:
    context: ./backend
  image: detal24-backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-detal24}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}@db:5432/${POSTGRES_DB:-detal24}
    TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-detal24}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-detal24}_test
    REDIS_URL: redis://redis:6379/0
    TEST_REDIS_URL: redis://redis:6379/1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-detal24}
      POSTGRES_USER: ${POSTGRES_USER:-detal24}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    <<: *backend-common
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend-common
    command: ["scripts/start-worker.sh"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3

  beat:
    <<: *backend-common
    command: ["scripts/start-beat.sh"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Планировщик не принимает запросов, поэтому проверяем, что его процесс жив
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: detal24-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      D24_BACKEND_UPSTREAM: backend:8000
      D24_FRONTEND_UPSTREAM: frontend:3000
      NGINX_ENVSUBST_FILTER: "^D24_"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
